name: Build Windows exe

# 上游原版构建依赖 Azure Trusted Signing（需要上游作者的签名账号，我们无权使用），
# 这里改为未签名构建：
#   · 去掉 azure/login 与两处 trusted-signing-action
#   · Inno Setup 用上游内置的 /DSkipSignTool 开关（iss 里 #ifndef SkipSignTool 就是为此留的）
# 代价：首次运行会有 SmartScreen 提示，需要点「仍要运行」。功能不受影响。

on:
  workflow_call:
  workflow_dispatch:

env:
  UPSTREAM: localsend/localsend
  REF: main

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      flutter: ${{ steps.v.outputs.flutter }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ env.REF }}
          path: src

      - name: Read version and Flutter version
        id: v
        run: |
          set -euo pipefail
          V="$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' src/app/pubspec.yaml | head -1)"
          [ -n "$V" ] || { echo "::error::无法从 app/pubspec.yaml 读取版本"; exit 1; }

          # 跟随上游锁定的 Flutter 版本，读不到就用已知可用值兜底
          F="$(grep -m1 'FLUTTER_VERSION:' src/.github/workflows/build_windows_exe.yml 2>/dev/null \
               | sed -E 's/.*"([^"]+)".*/\1/' || true)"
          [ -n "${F}" ] || F="3.41.9"

          echo "版本: $V / Flutter: $F"
          echo "version=$V"  >> "$GITHUB_OUTPUT"
          echo "flutter=$F"  >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    runs-on: windows-latest
    steps:
      - name: Fix long file paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ env.REF }}
          path: src

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.meta.outputs.flutter }}
          channel: stable

      # 未签名，仅打包出 msix（用于 sparse package / 通知功能）
      - name: Build MSIX helper
        working-directory: src
        run: |
          $makepri = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\makepri.exe' | Select-Object -Last 1
          & $makepri.FullName new /pr support\build\msix\content /cf support\build\msix\priconfig.xml /mn support\build\msix\content\AppxManifest.xml /of support\build\msix\content\resources.pri /o
          & 'C:\Program Files (x86)\Windows Kits\10\App Certification Kit\makeappx.exe' pack /o /d support\build\msix\content /nv /p app\windows\localsend_msix_helper.msix

      - name: Dependencies
        working-directory: src/app
        run: flutter pub get

      - name: Compile for Windows
        working-directory: src/app
        run: flutter build windows

      - name: Prepare Inno Setup payload
        working-directory: src
        run: |
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\inno" | Out-Null
          Copy-Item -Path "app\build\windows\x64\runner\Release\*" -Destination "${{ runner.temp }}\inno" -Recurse
          Copy-Item -Path "app\assets\packaging\logo.ico" -Destination "${{ runner.temp }}\inno"
          Copy-Item -Path "support\build\windows\x64\*" -Destination "${{ runner.temp }}\inno" -Recurse
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\inno-result" | Out-Null

      - name: Compile installer (unsigned)
        working-directory: src
        run: |
          iscc /DSkipSignTool `
               "/DPayloadDir=${{ runner.temp }}\inno" `
               "/DResultDir=${{ runner.temp }}\inno-result" `
               support\scripts\compile_windows_exe-inno.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rename installer
        run: |
          Rename-Item -Path "${{ runner.temp }}\inno-result\localsend.exe" `
                      -NewName "LocalSend-${{ needs.meta.outputs.version }}-windows-x86-64.exe"

      - uses: actions/upload-artifact@v6
        with:
          name: windows-exe-x86-64
          path: ${{ runner.temp }}\inno-result\LocalSend-*-windows-x86-64.exe
          if-no-files-found: error

name: Build Linux CLI

# 从上游 localsend/localsend 直接构建，不依赖任何 fork。
# 一次产出 4 个资产：
#   linux-x86-64 / linux-arm-64   → 在 ubuntu-22.04 宿主上编译（glibc 2.35+）
#   uos20-x86-64 / uos20-arm-64   → 在 debian:10 容器里编译（glibc 2.28，UOS 20 同款）

on:
  workflow_call:
    inputs:
      version:
        description: 版本号，留空则从 cli/Cargo.toml 读
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: 版本号，留空则从 cli/Cargo.toml 读
        type: string
        required: false
        default: ''

env:
  UPSTREAM: localsend/localsend
  REF: main

jobs:
  # ── 普通 Linux：宿主 glibc 2.35 ─────────────────────────────────────
  new-glibc:
    name: ${{ matrix.suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            suffix: linux-x86-64
          - runner: ubuntu-22.04-arm
            suffix: linux-arm-64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ env.REF }}
          path: src

      - name: Install Rust
        working-directory: src
        run: rustup toolchain install    # 版本取自 rust-toolchain.toml

      - name: Compile CLI
        working-directory: src
        run: cargo build --release --package localsend-cli

      - name: Archive
        working-directory: src
        env:
          GIVEN: ${{ inputs.version }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          V="${GIVEN}"
          if [ -z "$V" ]; then
            V="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)".*/\1/p' cli/Cargo.toml | head -1)"
          fi
          [ -n "$V" ] || { echo "::error::无法确定版本号"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/out"
          tar -czvf "$GITHUB_WORKSPACE/out/LocalSend-CLI-${V}-${SUFFIX}.tar.gz" \
            -C target/release localsend-cli
          echo "产出: LocalSend-CLI-${V}-${SUFFIX}.tar.gz"

      - uses: actions/upload-artifact@v6
        with:
          name: cli-${{ matrix.suffix }}
          path: out/*.tar.gz
          if-no-files-found: error

  # ── UOS 20：debian:10 容器，glibc 2.28 ──────────────────────────────
  uos20:
    name: ${{ matrix.suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            suffix: uos20-x86-64
          - runner: ubuntu-22.04-arm
            suffix: uos20-arm-64
    runs-on: ${{ matrix.runner }}
    container: debian:10
    # 容器作业的默认 shell 是 sh（debian:10 里是 dash），
    # 不支持 `set -o pipefail`，会直接报 "Illegal option -o pipefail"。
    # 全部 run 步骤改用 bash。
    defaults:
      run:
        shell: bash
    steps:
      # buster 已 EOL，源要切到 archive，且不再校验 Valid-Until
      - name: Install build dependencies
        run: |
          sed -i \
            -e 's|deb.debian.org|archive.debian.org|g' \
            -e '/security.debian.org/d' \
            /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git libssl-dev pkg-config

      - uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ env.REF }}
          path: src

      - name: Install Rust
        working-directory: src
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          . "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install toolchain from rust-toolchain.toml
        working-directory: src
        run: rustup toolchain install

      - name: Compile CLI
        working-directory: src
        run: cargo build --release --package localsend-cli

      - name: Archive
        working-directory: src
        env:
          GIVEN: ${{ inputs.version }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          V="${GIVEN}"
          if [ -z "$V" ]; then
            V="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)".*/\1/p' cli/Cargo.toml | head -1)"
          fi
          [ -n "$V" ] || { echo "::error::无法确定版本号"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/out"
          tar -czvf "$GITHUB_WORKSPACE/out/LocalSend-CLI-${V}-${SUFFIX}.tar.gz" \
            -C target/release localsend-cli
          echo "产出: LocalSend-CLI-${V}-${SUFFIX}.tar.gz"

      - uses: actions/upload-artifact@v6
        with:
          name: cli-${{ matrix.suffix }}
          path: out/*.tar.gz
          if-no-files-found: error

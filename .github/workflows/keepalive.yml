name: keepalive

# 仓库连续 60 天没有「活动」时，GitHub 会自动禁用里面的 scheduled workflow。
# 这个仓库平时只有 workflow 运行、没有 commit，正好会踩这个坑，
# 所以每月提交一个时间戳文件保活。
on:
  schedule:
    - cron: '0 3 1 * *'     # 每月 1 号 03:00 UTC = 11:00 北京
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 提交时间戳
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf '%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" > .keepalive
          git add .keepalive
          git commit -m "chore: keepalive $(date -u +%F)"
          git push

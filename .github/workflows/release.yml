name: Build & Release

# 每天构建一次，tag 带当天日期：v1.19.0-20261123
#
# 为什么用日期而不是纯版本号：上游 cli 的版本一个多月才动一次，纯版本号做 tag 会让
# 「今天构建的」和「一个月前构建的」长得一模一样，本地也不可能有新包可拉。
# 带上日期后，每天都是一个独立 release，本地按 tag 比一次就知道有没有新东西。
#
# 本仓库不是 fork，所以 schedule 可以正常调度 —— 这是它存在的核心理由。
#
# cron 故意错开整点：GitHub 的调度队列在整点最拥挤，:00 最容易排队等待，
# 排到 :07 能少等几分钟，构建通常在 04:15 前完成，本机 10:00 取包绰绰有余。
on:
  schedule:
    - cron: '7 20 * * *'      # UTC 20:07 = 北京次日 04:07（避开整点高峰）
  workflow_dispatch:
    inputs:
      force:
        description: 今天已发过也再构建一次（覆盖同名 tag 的资产）
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

env:
  UPSTREAM: localsend/localsend
  REF: main

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
      date: ${{ steps.v.outputs.date }}
      tag: ${{ steps.v.outputs.tag }}
      need: ${{ steps.v.outputs.need }}
    steps:
      - name: 算出今天的 tag 并判断是否需要构建
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          CARGO="$(gh api "repos/${UPSTREAM}/contents/cli/Cargo.toml?ref=${REF}" \
                    -H 'Accept: application/vnd.github.raw')"
          VER="$(printf '%s\n' "$CARGO" \
                  | sed -n 's/^version[[:space:]]*=[[:space:]]*"\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)".*/\1/p' \
                  | head -1)"
          [ -n "$VER" ] || { echo "::error::无法从上游 cli/Cargo.toml 解析版本号"; exit 1; }

          SHA="$(gh api "repos/${UPSTREAM}/commits/${REF}" --jq .sha)"

          # 日期必须取北京时区。cron 在 UTC 20:07 跑，此刻 UTC 还是前一天，
          # 用 date -u 会让 tag 永远比北京日历少一天（fork 时代踩过这个坑：
          # 早上手动发版时 tag 和前一天完全相同，资产被 --clobber 覆盖，看起来像没发布）。
          DATE="$(TZ=Asia/Shanghai date +%Y%m%d)"
          TAG="v${VER}-${DATE}"

          EXISTS=0
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && EXISTS=1

          # 上一次发布记录的上游 commit（写在 release 正文的 HTML 注释里，页面上看不见）。
          # 用它判断「上游到底动没动」：只改日期、重复构建同一个 commit 没有意义。
          LAST_SHA="$(gh release view -R "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null \
                      | sed -n 's/.*<!-- upstream-sha: \([0-9a-f]\{40\}\) -->.*/\1/p' | head -1)"
          LAST_SHORT="${LAST_SHA:0:7}"; LAST_SHORT="${LAST_SHORT:-无记录}"

          if [ "${FORCE}" = "true" ]; then
            NEED=true;  WHY="手动强制重建，覆盖 $TAG"
          elif [ -n "$LAST_SHA" ] && [ "$LAST_SHA" = "$SHA" ]; then
            NEED=false; WHY="上游没有新提交（仍是 ${SHA:0:7}），不发布"
          elif [ "$EXISTS" = 1 ]; then
            NEED=false; WHY="今天已经发过 $TAG，跳过"
          else
            NEED=true;  WHY="上游有新提交 ${SHA:0:7}（上次 ${LAST_SHORT}）"
          fi

          echo "上游 cli/Cargo.toml 版本: $VER"
          echo "上游 commit: $SHA"
          echo "上次发布时的 commit: ${LAST_SHA:-（无记录）}"
          echo "构建日期: $DATE"
          echo "目标 tag: $TAG"
          echo "决定: $WHY"

          {
            echo "### 版本检查"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 上游版本 | \`$VER\` |"
            echo "| 上游 commit | \`${SHA:0:7}\` |"
            echo "| 上次发布的 commit | \`${LAST_SHORT}\` |"
            echo "| 构建日期（北京） | \`$DATE\` |"
            echo "| 目标 tag | \`$TAG\` |"
            echo "| 结论 | $WHY |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"     >> "$GITHUB_OUTPUT"
          echo "date=$DATE"   >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "need=$NEED"   >> "$GITHUB_OUTPUT"

  linux:
    needs: check
    if: needs.check.outputs.need == 'true'
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.check.outputs.version }}
      date: ${{ needs.check.outputs.date }}

  # Windows 安装包默认不参与发布。
  # 构建本身是通的（未签名 MSIX + Inno 的 /DSkipSignTool 都验证过），
  # 但它要跑 20 分钟、只产出 GUI 的 exe，对 CLI 用途没有增益。
  # 需要时手动触发 build-windows.yml 即可；要恢复自动发布，把下面这段放开：

  # windows:
  #   needs: check
  #   if: needs.check.outputs.need == 'true'
  #   uses: ./.github/workflows/build-windows.yml

  publish:
    needs: [check, linux]
    # 不要求 linux 整体 success：矩阵里某一个架构挂了，其余产物照样发出去更有用。
    # 真正的守门是下面「检查产物」那一步 —— 一个文件都没有才失败。
    if: always() && needs.check.outputs.need == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        continue-on-error: true      # 没有产物时它自己会失败，交给下一步判断
        with:
          path: dist
          merge-multiple: true

      - name: 检查产物
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::没有任何构建产物，所有矩阵任务都失败了"
            exit 1
          fi
          echo "共 ${#files[@]} 个产物："
          ls -lh dist/

      - name: 生成 release 说明
        env:
          VER: ${{ needs.check.outputs.version }}
          SHA: ${{ needs.check.outputs.sha }}
          DATE: ${{ needs.check.outputs.date }}
        run: |
          set -euo pipefail
          SHORT="$(printf '%s' "$SHA" | cut -c1-7)"
          HUMAN="${DATE:0:4}-${DATE:4:2}-${DATE:6:2}"
          {
            echo "构建于 **${HUMAN}**（北京时间），对应上游 [\`${UPSTREAM}\`](https://github.com/${UPSTREAM}) 的 \`${REF}\` @ \`${SHORT}\`"
            echo
            echo "| 资产 | 适用环境 |"
            echo "|---|---|"
            for f in dist/*; do
              n="$(basename "$f")"
              case "$n" in
                *uos20-x86-64.tar.gz) d="glibc 2.28，x86-64（UOS 20 / Debian 10+）" ;;
                *uos20-arm-64.tar.gz) d="glibc 2.28，aarch64（同上）" ;;
                *linux-x86-64.tar.gz) d="glibc ≥ 2.34，x86-64（Ubuntu 22.04+）" ;;
                *linux-arm-64.tar.gz) d="glibc ≥ 2.34，aarch64（同上）" ;;
                *.exe)                 d="Windows 10/11 x64，未签名" ;;
                *)                     d="—" ;;
              esac
              echo "| \`${n}\` | ${d} |"
            done
            echo
            echo "CLI 安装："
            echo
            echo '```bash'
            echo "tar -xzf <对应的 tar.gz> -C ~/.local/bin"
            echo "localsend-cli --version"
            echo '```'
            echo
            echo "> 老系统（UOS 20、Debian 10、CentOS 7 等）请用 \`uos20-*\` 版，"
            echo "> 否则会报 \`GLIBC_2.34 not found\`。"
            shopt -s nullglob
            exes=(dist/*.exe)
            if [ ${#exes[@]} -gt 0 ]; then
              echo ">"
              echo "> Windows 安装包未经代码签名（上游用的是付费 Azure Trusted Signing），"
              echo "> 首次运行会出现 SmartScreen 提示，点「更多信息 → 仍要运行」即可。"
            fi
            # 机器可读标记：下次 check 靠它判断「上游有没有新提交」。
            # HTML 注释在 release 页面上不显示，不会影响阅读。
            echo
            echo "<!-- upstream-sha: ${SHA} -->"
          } > notes.md
          cat notes.md

      - name: 发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
          VER: ${{ needs.check.outputs.version }}
          DATE: ${{ needs.check.outputs.date }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 这个 job 没有 checkout，目录里没有 .git，gh 自己推断不出仓库，
          # 会报 "failed to run git: fatal: not a git repository"。
          # 所以所有 gh 命令都显式带 -R。
          HUMAN="${DATE:0:4}-${DATE:4:2}-${DATE:6:2}"
          TITLE="LocalSend CLI ${VER} · ${HUMAN}"

          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            echo "已有 $TAG（force 重建），覆盖资产并刷新说明"
            gh release upload "$TAG" dist/* --clobber -R "$REPO"
            # 说明模板改了也要能生效，否则旧 release 永远停在首次创建时的文字
            gh release edit "$TAG" -R "$REPO" --notes-file notes.md --title "$TITLE"
          else
            echo "创建 $TAG"
            gh release create "$TAG" dist/* -R "$REPO" \
              --title "$TITLE" \
              --notes-file notes.md \
              --latest
          fi
          gh release view "$TAG" -R "$REPO" --json url,assets \
            --jq '"\(.url)  资产 \(.assets|length) 个"'
